[project]
name = "gridvareditor"
version = "1.1.0"
description = "Visual editor for 2D fields (KMT, water depth/elevation, region mask, ...) on a POP ocean model curvilinear grid"
requires-python = ">=3.9"
dependencies = [
    "netCDF4>=1.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "cartopy>=0.22",
]

[tool.uv]
package = false
